<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="left-section">
      <div class="logo">
        <img src="" alt="" class="logo-image" />
        <h1 class="logo-text"></h1>
      </div>
    </div>
    <div class="right-section">
      <div class="greater-text">
        <p>
          This is not real online service! You know you need something like this
          in your life to help you realize your deepest dreams.
        </p>
        <p>You know you want to</p>
      </div>
      <form class="login-form">
        <h2>Let's do this!</h2>
        <div class="form-input-wraper">
          <div class="form-input">
            <label for="first-name">FIRST NAME</label>
            <input id="first-name" type="text" required />
          </div>
          <div class="form-input">
            <label for="last-name">LAST NAME</label>
            <input id="last-name" type="text" required />
          </div>
          <div class="form-input">
            <label for="mail">EMAIL</label>
            <input id="mail" type="email" required />
          </div>
          <div class="form-input">
            <label for="phone-number">PHONE NUMBER</label>
            <input id="phone-number" type="tel" required />
          </div>
          <div class="form-input">
            <label for="password">PASSWORD</label>
            <input id="password" type="password" required />
          </div>
          <div class="form-input">
            <label for="confirm-password">CONFIRM PASSWORD</label>
            <input id="confirm-password" type="password" required />
          </div>
        </div>
        <button type="submit">Create Account</button>
      </form>
      <p>Already have an account? <a href="">Log In</a></p>
    </div>
  </body>
</html>
